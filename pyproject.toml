[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-state-ledger"
version = "1.0.0"
description = "Production-grade virtual memory controller for multi-agent LLM state management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Agent State Ledger Contributors" }
]
keywords = [
    "llm", "agents", "state-management", "context-window",
    "fastapi", "mcp", "multi-agent", "rollback"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",

    # MCP / JSON-RPC transport
    "fastmcp>=0.4.0",
    "jsonrpcserver>=5.0.9",
    "jsonrpcclient>=4.0.3",

    # Async & concurrency
    "anyio>=4.3.0",
    "asyncio-throttle>=1.0.2",

    # Data validation & serialization
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Persistence / snapshot store
    "aiosqlite>=0.20.0",
    "aiofiles>=23.2.1",
    "orjson>=3.10.0",

    # Metrics & observability
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",

    # Utilities
    "tenacity>=8.3.0",
    "python-ulid>=2.2.0",
    "xxhash>=3.4.1",
    "cachetools>=5.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
asl-router  = "agent_state_ledger.router.main:run_server"
asl-monitor = "agent_state_ledger.snapshot.monitor:run_monitor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
